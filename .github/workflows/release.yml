name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build panel
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: anchore/sbom-action/download-syft@v0

      - name: test
        run: cargo test --workspace --all-targets --locked

      - name: package
        run: ./scripts/build-release.sh --no-web --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: meatus-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.spdx.json

  docker:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    env:
      ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com/mist/meatus
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: env.ACR_USERNAME != ''
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ env.ACR_USERNAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: build and push GHCR + ACR
        run: |
          if [ -n "$ACR_USERNAME" ]; then
            ./scripts/docker-release.sh --version "$VERSION"
          else
            ./scripts/docker-release.sh --version "$VERSION" --skip-acr
          fi

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/binsail/meatus:${{ env.VERSION }}
          format: spdx-json
          output-file: dist/sbom-meatus-${{ env.VERSION }}-image.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: meatus-sbom
          path: dist/sbom-meatus-*.spdx.json

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.sha256
            artifacts/*.spdx.json
          generate_release_notes: true
