# Meatus 客户端 YAML 配置示例
# 复制为 client.yaml 后按需修改；token 从 `meatus gen-token` 获取。
# 管理面板可写回，但会规范化重写，注释和键顺序不保证保留。

client:
  server_addr: "tunnel.example.com:7000"
  transport: "tcp"
  server_name: "tunnel.example.com"
  client_id: "home-nas"
  tenant: "default"
  token: "${MEATUS_CLIENT_TOKEN}"
  # 数据连接池（V1.4）：默认关闭；关闭时行为与 1.3 完全一致
  pool:
    enabled: false
    size: 4                    # 1..=16
    max_streams_per_conn: 64   # 1..=1024
    idle_timeout_s: 300        # 1..=3600

proxy:
  - name: "ssh"
    type: "tcp"
    local_addr: "127.0.0.1:22"
    remote_port: 20022

  # SOCKS5 域名目标示例
  # - name: "socks"
  #   type: "socks5"
  #   local_addr: "127.0.0.1:0"
  #   options:
  #     allow_cidrs: ["10.0.0.0/8", "192.168.1.0/24", "127.0.0.1/32"]
  #     allow_domains: ["localhost", "*.internal.example"]

  # HTTP 代理示例
  # - name: "nas-web"
  #   type: "http"
  #   local_addr: "127.0.0.1:8080"
  #   remote_port: 0
  #   custom_domains: ["nas.tunnel.example.com"]

log:
  level: "info"
  format: "text"
