[package]
name = "meatus-fuzz"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[profile.release]
debug = 1

[workspace]

[[bin]]
name = "decode_control_frame"
path = "fuzz_targets/decode_control_frame.rs"
test = false
doc = false

[[bin]]
name = "parse_config"
path = "fuzz_targets/parse_config.rs"
test = false
doc = false

[dependencies]
libfuzzer-sys = "0.4"
meatus-proto = { path = "../crates/meatus-proto" }
meatus-core = { path = "../crates/meatus-core" }
